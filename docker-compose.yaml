services:
  neo4j:
    image: neo4j:5.26-community
    container_name: brain-neo4j
    ports:
      - "7474:7474"   # browser
      - "7687:7687"   # bolt
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:?set NEO4J_PASSWORD in .env}
      NEO4J_PLUGINS: '["apoc"]'
      NEO4J_apoc_export_file_enabled: "true"
      NEO4J_apoc_import_file_enabled: "true"
      NEO4J_dbms_security_procedures_unrestricted: "apoc.*"
      NEO4J_server_memory_heap_max__size: 1G
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:7474 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12

  qdrant:
    image: qdrant/qdrant:v1.12.4
    container_name: brain-qdrant
    ports:
      - "6333:6333"   # http + dashboard
      - "6334:6334"   # grpc
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/6333' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12

  # The notebook is your development surface. This service is the same code
  # packaged as a long running app, for when you want the UI without Jupyter.
  # Opt in with:  docker compose --profile app up -d rag
  rag:
    build: .
    container_name: brain-rag
    profiles: ["app"]
    ports:
      - "7860:7860"
    env_file: .env
    environment:
      NEO4J_URI: bolt://neo4j:7687
      QDRANT_URL: http://qdrant:6333
      RAW_DIR: /app/data/raw
      GRADIO_SERVER_NAME: 0.0.0.0
    volumes:
      - ./data:/app/data
      - ./src:/app/src
    depends_on:
      neo4j:
        condition: service_healthy
      qdrant:
        condition: service_healthy

volumes:
  neo4j_data:
  neo4j_logs:
  qdrant_data:
